<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Relay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 7h12l-3-3M20 17H8l3 3'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1a1d23; --muted: #667085; --border: #e3e6eb;
  --accent: #2563eb; --accent-text: #ffffff; --accent-soft: #e8efff; --danger: #c92a2a; --danger-soft: #fdecec;
  --ok: #18794e; --row-hover: #f2f4f7; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --text: #e6e8ec; --muted: #8b93a1; --border: #2a2f3a;
    --accent: #5b8cff; --accent-text: #0b0d12; --accent-soft: #1c2740; --danger: #ff6b6b; --danger-soft: #3a1d1f;
    --ok: #4cc38a; --row-hover: #1d212a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --text: #e6e8ec; --muted: #8b93a1; --border: #2a2f3a;
  --accent: #5b8cff; --accent-text: #0b0d12; --accent-soft: #1c2740; --danger: #ff6b6b; --danger-soft: #3a1d1f;
  --ok: #4cc38a; --row-hover: #1d212a; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
header .spacer { flex: 1; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge.read { background: var(--row-hover); color: var(--muted); }
.stat { color: var(--muted); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--row-hover); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; padding: 4px 8px; }
.btn.ghost:hover { background: var(--row-hover); }
.btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
.btn svg { width: 16px; height: 16px; flex: none; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.crumbs { flex: 1; min-width: 200px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-weight: 500; }
.crumbs a { padding: 2px 4px; border-radius: 4px; }
.crumbs span.sep { color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--row-hover); }
td.name { word-break: break-all; }
td.name a, td.name span { display: inline-flex; align-items: center; gap: 8px; }
td.name svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
td.name .dir svg { color: var(--accent); }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.when { color: var(--muted); white-space: nowrap; }
td.actions { text-align: right; white-space: nowrap; width: 1%; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.drop { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 3px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: var(--accent); z-index: 50; pointer-events: none; }
.drop.on { display: flex; }
.uploads { margin-top: 16px; }
.uploads h3, .help h3 { margin: 0; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.up { padding: 8px 12px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.up:last-child { border-bottom: 0; }
.up .p { word-break: break-all; }
.up .s { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.up .bar { grid-column: 1 / -1; height: 4px; background: var(--row-hover); border-radius: 2px; overflow: hidden; }
.up .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.up.done .bar i { background: var(--ok); }
.up.fail .bar i { background: var(--danger); width: 100% !important; }
.up.fail .s { color: var(--danger); }
.help { margin-top: 16px; }
.help .body { padding: 12px; }
.help p { margin: 0 0 8px; color: var(--muted); }
pre { margin: 0 0 12px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; font: 12.5px/1.55 var(--mono); position: relative; }
pre .cp { position: absolute; top: 6px; right: 6px; }
code { font-family: var(--mono); font-size: 12.5px; }
details summary { cursor: pointer; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details[open] summary .chev { transform: rotate(90deg); }
.chev { transition: transform .15s; width: 16px; height: 16px; }
.login { max-width: 380px; margin: 12vh auto 0; padding: 28px; }
.login h1 { font-size: 20px; margin: 0 0 4px; }
.login p { color: var(--muted); margin: 0 0 18px; }
.login input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); margin-bottom: 12px; font-family: var(--mono); }
.login input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.login .btn { width: 100%; justify-content: center; padding: 9px; }
.login .err { color: var(--danger); min-height: 20px; margin-top: 10px; font-size: 13px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; max-width: calc(100% - 32px); word-break: break-all; }
.toast.on { opacity: 1; }
.hidden { display: none !important; }
@media (max-width: 700px) {
  th.when, td.when, th.exp, td.exp { display: none; }
  td.actions .btn .lbl { display: none; }
  th, td { padding: 8px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8M20 3v5h-5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></symbol>
  <symbol id="i-hash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-relay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12l-3-3M20 17H8l3 3"/></symbol>
</svg>

<div id="login" class="panel login hidden">
  <h1>File Relay</h1>
  <p>Enter the access token for this relay.</p>
  <form id="loginForm">
    <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Token" required>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="wrap hidden">
  <header>
    <h1><svg width="22" height="22" style="color:var(--accent)"><use href="#i-relay"/></svg>File Relay</h1>
    <span id="access" class="badge"></span>
    <span class="spacer"></span>
    <span id="stats" class="stat"></span>
    <button class="btn ghost" id="logout">Sign out</button>
  </header>

  <div class="panel">
    <div class="toolbar">
      <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
      <span class="w">
        <button class="btn primary" id="btnUpload"><svg><use href="#i-up"/></svg>Upload files</button>
        <button class="btn" id="btnUploadDir"><svg><use href="#i-folder"/></svg>Upload folder</button>
        <button class="btn" id="btnMkdir"><svg><use href="#i-plus"/></svg>New folder</button>
      </span>
      <button class="btn ghost" id="btnRefresh" title="Refresh" aria-label="Refresh"><svg><use href="#i-refresh"/></svg></button>
      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory multiple hidden>
    </div>
    <table>
      <thead><tr><th>Name</th><th class="num">Size</th><th class="when">Uploaded</th><th class="when exp">Expires</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty hidden">This folder is empty. <span class="w">Drop files anywhere on the page to upload them.</span></div>
  </div>

  <div id="uploads" class="panel uploads hidden">
    <h3><svg width="16" height="16"><use href="#i-up"/></svg>Uploads <span class="spacer" style="flex:1"></span><button class="btn ghost" id="clearUploads">Clear finished</button></h3>
    <div id="upList"></div>
  </div>

  <details class="panel help" id="help">
    <summary><h3><svg class="chev"><use href="#i-chev"/></svg>Command line &amp; agent setup</h3></summary>
    <div class="body" id="helpBody"></div>
  </details>
</div>

<div class="drop" id="drop">Drop files to upload to <span id="dropTarget" style="margin-left:6px"></span></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { path: "/", info: null, entries: [] };
  const canWrite = () => state.info && state.info.access === "write";

  const enc = (p) => p.split("/").map(encodeURIComponent).join("/");
  const join = (...parts) => "/" + parts.join("/").split("/").filter(Boolean).join("/");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (id) => `<svg><use href="#i-${id}"/></svg>`;

  function fmtSize(n) {
    if (n < 1024) return n + " B";
    const u = ["KB", "MB", "GB", "TB"]; let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n < 10 ? 1 : 0) + " " + u[i];
  }
  function fmtAgo(t) {
    const s = (Date.now() - new Date(t)) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return new Date(t).toLocaleString();
  }
  function fmtIn(t) {
    if (!t) return "never";
    const s = (new Date(t) - Date.now()) / 1000;
    if (s <= 0) return "soon";
    if (s < 3600) return "in " + Math.ceil(s / 60) + " min";
    if (s < 172800) return "in " + Math.round(s / 3600) + " h";
    return "in " + Math.round(s / 86400) + " d";
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
  }
  async function copy(text, what) {
    try { await navigator.clipboard.writeText(text); toast((what || "Text") + " copied"); }
    catch { prompt("Copy:", text); }
  }

  async function api(method, url, body) {
    const opts = { method, headers: {}, credentials: "same-origin" };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    if (r.status === 401) { showLogin(); throw new Error("Not signed in"); }
    const ct = r.headers.get("Content-Type") || "";
    const data = ct.includes("json") ? await r.json() : null;
    if (!r.ok) throw new Error((data && data.error) || r.statusText);
    return data;
  }

  // ---- auth ----
  function showLogin() {
    $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("tokenInput").focus();
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("loginErr").textContent = "";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: $("tokenInput").value }) });
      if (!r.ok) throw new Error((await r.json()).error || "Sign in failed");
      $("tokenInput").value = ""; start();
    } catch (err) { $("loginErr").textContent = err.message; }
  });
  $("logout").addEventListener("click", async () => { await fetch("/api/logout", { method: "POST" }); showLogin(); });

  // ---- browse ----
  async function start() {
    try { state.info = await api("GET", "/api/info"); } catch { return; }
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    $("access").textContent = canWrite() ? "read-write" : "read-only";
    $("access").className = "badge" + (canWrite() ? "" : " read");
    document.querySelectorAll(".w").forEach((el) => el.classList.toggle("hidden", !canWrite()));
    renderStats(); renderHelp();
    go(decodeURIComponent(location.hash.slice(1)) || "/");
  }
  function renderStats() {
    const i = state.info;
    const ttl = i.ttlSeconds ? `files expire after ${i.ttlSeconds >= 86400 && i.ttlSeconds % 86400 === 0 ? i.ttlSeconds / 86400 + " d" : Math.round(i.ttlSeconds / 3600) + " h"}` : "no expiry";
    $("stats").textContent = `${i.files} file${i.files === 1 ? "" : "s"} · ${fmtSize(i.usedBytes)} · ${ttl}`;
  }
  async function refreshInfo() { try { state.info = await api("GET", "/api/info"); renderStats(); } catch {} }

  async function go(p) {
    state.path = join(p);
    if (location.hash.slice(1) !== enc(state.path)) history.replaceState(null, "", "#" + enc(state.path));
    renderCrumbs();
    try {
      const d = await api("GET", "/api/ls" + enc(state.path));
      state.entries = d.entries; renderRows();
    } catch (err) {
      if (state.path !== "/" && /not found|not a directory/.test(err.message)) return go("/");
      toast(err.message);
    }
  }
  window.addEventListener("hashchange", () => { const p = decodeURIComponent(location.hash.slice(1)) || "/"; if (p !== state.path) go(p); });

  function renderCrumbs() {
    const parts = state.path.split("/").filter(Boolean);
    let html = `<a href="#/" data-go="/">relay</a>`, acc = "";
    for (const part of parts) { acc += "/" + part; html += `<span class="sep">/</span><a href="#${esc(enc(acc))}" data-go="${esc(acc)}">${esc(part)}</a>`; }
    $("crumbs").innerHTML = html;
    $("dropTarget").textContent = state.path;
  }
  $("crumbs").addEventListener("click", (e) => { const a = e.target.closest("[data-go]"); if (a) { e.preventDefault(); go(a.dataset.go); } });

  function renderRows() {
    const rows = state.entries.map((e, i) => {
      const nameCell = e.dir
        ? `<a class="dir" href="#${esc(enc(e.path))}" data-go="${esc(e.path)}">${icon("folder")}${esc(e.name)}</a>`
        : `<a href="/api/files${esc(enc(e.path))}?download=1" download>${icon("file")}${esc(e.name)}</a>`;
      const acts = [];
      if (!e.dir) {
        acts.push(`<button class="btn ghost" data-act="cmd" data-i="${i}" title="Copy pull command">${icon("term")}<span class="lbl">Pull cmd</span></button>`);
        acts.push(`<button class="btn ghost" data-act="sum" data-i="${i}" title="Copy SHA-256">${icon("hash")}</button>`);
      } else {
        acts.push(`<a class="btn ghost" href="/api/archive${esc(enc(e.path))}" title="Download as tar.gz">${icon("down")}</a>`);
        acts.push(`<button class="btn ghost" data-act="cmd" data-i="${i}" title="Copy pull command">${icon("term")}<span class="lbl">Pull cmd</span></button>`);
      }
      if (canWrite()) acts.push(`<button class="btn ghost danger" data-act="rm" data-i="${i}" title="Delete">${icon("trash")}</button>`);
      return `<tr><td class="name">${nameCell}</td><td class="num">${e.dir ? "" : fmtSize(e.size)}</td>` +
        `<td class="when" title="${esc(new Date(e.mtime).toLocaleString())}">${fmtAgo(e.mtime)}</td>` +
        `<td class="when exp">${e.dir ? "" : fmtIn(e.expires)}</td><td class="actions">${acts.join("")}</td></tr>`;
    });
    if (state.path !== "/") {
      const up = state.path.split("/").slice(0, -1).join("/") || "/";
      rows.unshift(`<tr><td class="name" colspan="5"><a class="dir" href="#${esc(enc(up))}" data-go="${esc(up)}">${icon("folder")}..</a></td></tr>`);
    }
    $("rows").innerHTML = rows.join("");
    $("empty").classList.toggle("hidden", state.entries.length > 0);
  }

  $("rows").addEventListener("click", async (e) => {
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); return go(g.dataset.go); }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const en = state.entries[+b.dataset.i];
    if (b.dataset.act === "cmd") {
      copy(`./relay pull '${en.path.replace(/'/g, "'\\''")}' .`, "Pull command");
    } else if (b.dataset.act === "sum") {
      try { const r = await api("GET", "/api/sum" + enc(en.path)); copy(r.sha256, "SHA-256"); } catch (err) { toast(err.message); }
    } else if (b.dataset.act === "rm") {
      if (!confirm(`Delete ${en.dir ? "folder" : "file"} "${en.name}"${en.dir ? " and everything in it" : ""}?`)) return;
      try { await api("DELETE", "/api/files" + enc(en.path)); toast("Deleted " + en.name); go(state.path); refreshInfo(); } catch (err) { toast(err.message); }
    }
  });

  $("btnRefresh").addEventListener("click", () => { go(state.path); refreshInfo(); });
  $("btnMkdir").addEventListener("click", async () => {
    const name = prompt("New folder name:"); if (!name) return;
    try { await api("POST", "/api/mkdir" + enc(join(state.path, name))); go(state.path); } catch (err) { toast(err.message); }
  });

  // ---- upload ----
  const queue = []; let active = 0; const MAX_PARALLEL = 3;
  $("btnUpload").addEventListener("click", () => $("fileInput").click());
  $("btnUploadDir").addEventListener("click", () => $("dirInput").click());
  $("fileInput").addEventListener("change", (e) => { enqueue([...e.target.files].map((f) => [f, f.name])); e.target.value = ""; });
  $("dirInput").addEventListener("change", (e) => { enqueue([...e.target.files].map((f) => [f, f.webkitRelativePath || f.name])); e.target.value = ""; });

  function enqueue(items) {
    if (!canWrite() || !items.length) return;
    $("uploads").classList.remove("hidden");
    const base = state.path;
    for (const [file, rel] of items) {
      const el = document.createElement("div"); el.className = "up";
      const dest = join(base, rel);
      el.innerHTML = `<div class="p">${esc(dest)}</div><div class="s">queued</div><div class="bar"><i></i></div>`;
      $("upList").prepend(el);
      queue.push({ file, dest, el });
    }
    pump();
  }
  function pump() {
    while (active < MAX_PARALLEL && queue.length) { active++; send(queue.shift()).finally(() => { active--; pump(); if (!active && !queue.length) { go(state.path); refreshInfo(); } }); }
  }
  function send({ file, dest, el }) {
    return new Promise((resolve) => {
      const s = el.querySelector(".s"), bar = el.querySelector(".bar i");
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", "/api/files" + enc(dest));
      xhr.setRequestHeader("X-Total-Size", String(file.size));
      const t0 = Date.now();
      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = (e.loaded / e.total) * 100, rate = e.loaded / Math.max(1, (Date.now() - t0) / 1000);
        bar.style.width = pct.toFixed(1) + "%";
        s.textContent = `${fmtSize(e.loaded)} / ${fmtSize(e.total)} · ${fmtSize(rate)}/s`;
      };
      xhr.onload = () => {
        let res = {}; try { res = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 201) { el.classList.add("done"); bar.style.width = "100%"; s.textContent = `${fmtSize(file.size)} · sha256 ${res.sha256.slice(0, 12)}…`; s.title = res.sha256; }
        else { el.classList.add("fail"); s.textContent = res.error || ("HTTP " + xhr.status); if (xhr.status === 401) showLogin(); }
        resolve();
      };
      xhr.onerror = () => { el.classList.add("fail"); s.textContent = "network error"; resolve(); };
      s.textContent = "starting…";
      xhr.send(file);
    });
  }
  $("clearUploads").addEventListener("click", () => {
    document.querySelectorAll(".up.done, .up.fail").forEach((el) => el.remove());
    if (!$("upList").children.length) $("uploads").classList.add("hidden");
  });

  // Drag & drop, including folders via the entries API.
  let dragDepth = 0;
  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
  window.addEventListener("dragenter", (e) => { if (!hasFiles(e) || !canWrite()) return; e.preventDefault(); dragDepth++; $("drop").classList.add("on"); });
  window.addEventListener("dragleave", (e) => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("on"); } });
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("drop", async (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; $("drop").classList.remove("on");
    if (!canWrite()) return;
    const entries = [...e.dataTransfer.items].map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
    if (!entries.length) return enqueue([...e.dataTransfer.files].map((f) => [f, f.name]));
    const out = [];
    async function walk(entry, prefix) {
      if (entry.isFile) { out.push([await new Promise((res, rej) => entry.file(res, rej)), prefix + entry.name]); return; }
      const reader = entry.createReader();
      for (;;) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        for (const child of batch) await walk(child, prefix + entry.name + "/");
      }
    }
    for (const en of entries) await walk(en, "");
    enqueue(out);
  });

  // ---- help ----
  function renderHelp() {
    const base = state.info.baseURL;
    const block = (code) => `<pre><button class="btn ghost cp" title="Copy">${icon("copy")}</button>${esc(code)}</pre>`;
    $("helpBody").innerHTML = `
      <p>Install the client on each server (needs bash and curl), then set the token:</p>
      ${block(`curl -fsSL ${base}/relay.sh -o relay && chmod +x relay\nexport RELAY_URL=${base} RELAY_TOKEN=<token>`)}
      <p>On the source server:</p>
      ${block(`./relay pack /srv/myapp /migration     # tar.gz + upload, keeps permissions\n./relay push ./dump.sql /migration     # single file or directory`)}
      <p>On the destination server:</p>
      ${block(`./relay unpack /migration/myapp.tar.gz /srv\n./relay pull /migration/dump.sql .`)}
      <p>Transfers resume after interruptions and are verified with SHA-256.
         To get an AI agent started, tell it to read <a href="/agent.md" target="_blank"><code>${esc(base)}/agent.md</code></a>.
         WebDAV: <code>${esc(base)}/dav/</code> (any username, token as password).</p>`;
  }
  $("helpBody").addEventListener("click", (e) => {
    const b = e.target.closest(".cp"); if (!b) return;
    copy(b.parentElement.textContent.trim(), "Command");
  });

  start();
})();
</script>
